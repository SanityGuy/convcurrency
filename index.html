<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConvCurrency</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 py-12">

        <section class="relative w-full max-w-2xl rounded-3xl border border-white/10 bg-white/[0.06] p-6 shadow-2xl shadow-black/30 backdrop-blur-xl transition duration-500 hover:-translate-y-1 sm:p-10">
            <header class="mb-8">
                <div class="mb-5 inline-flex items-center gap-2 rounded-full border border-indigo-400/20 bg-indigo-400/10 px-3 py-1 text-xs font-semibold uppercase tracking-widest text-indigo-300">
                    <span class="h-2 w-2 rounded-full bg-indigo-400"></span>
                    ConvCurrency
                </div>
                <h1 id="title" class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Convert money, effortlessly.</h1>
                <p id="description" class="mt-3 max-w-lg text-sm leading-6 text-slate-400 sm:text-base">Choose your currencies, enter an amount, and get a clear conversion in seconds.</p>
                <p id="last-updated" class="mt-4 text-center text-xs text-slate-500"></p>
            </header>

            <form class="space-y-5" id="currency-converter">
                <div class="grid gap-4 sm:grid-cols-2">
                    <label class="group rounded-2xl border border-white/10 bg-slate-900/70 p-4 transition duration-300 hover:-translate-y-0.5 hover:border-indigo-400/50 hover:shadow-lg hover:shadow-indigo-950/30" for="currency-one">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Currency one</span>
                        <select id="currency-one" name="currency-one" class="mt-3 w-full cursor-pointer bg-transparent text-lg font-semibold text-white outline-none transition focus:text-indigo-300">
                            <option value="USD" class="bg-slate-900">🇺🇸 USD — US Dollar</option>
                            <option value="EUR" class="bg-slate-900">🇪🇺 EUR — Euro</option>
                            <option value="GBP" class="bg-slate-900">🇬🇧 GBP — British Pound</option>
                            <option value="JPY" class="bg-slate-900">🇯🇵 JPY — Japanese Yen</option>
                        </select>
                    </label>
                    <label class="group rounded-2xl border border-white/10 bg-slate-900/70 p-4 transition duration-300 hover:-translate-y-0.5 hover:border-cyan-400/50 hover:shadow-lg hover:shadow-cyan-950/30" for="currency-two">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Currency two</span>
                        <select id="currency-two" name="currency-two" class="mt-3 w-full cursor-pointer bg-transparent text-lg font-semibold text-white outline-none transition focus:text-cyan-300">
                            <option value="EUR" class="bg-slate-900">🇪🇺 EUR — Euro</option>
                            <option value="USD" class="bg-slate-900">🇺🇸 USD — US Dollar</option>
                            <option value="GBP" class="bg-slate-900">🇬🇧 GBP — British Pound</option>
                            <option value="JPY" class="bg-slate-900">🇯🇵 JPY — Japanese Yen</option>
                            <option value="IDR" class="bg-slate-900">🇮🇩 IDR — Indonesian Rupiah</option>
                        </select>
                    </label>
                </div>

                <div class="grid gap-4 sm:grid-cols-2">
                    <label class="rounded-2xl border border-white/10 bg-slate-900/70 p-4 transition duration-300 focus-within:-translate-y-0.5 focus-within:border-indigo-400 focus-within:ring-2 focus-within:ring-indigo-400/20" for="amount-one">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Amount in currency one</span>
                        <input id="amount-one" name="amount-one" type="number" min="0" step="any" placeholder="0.00" class="mt-2 w-full bg-transparent text-2xl font-bold text-white outline-none placeholder:text-slate-600">
                    </label>
                    <label class="rounded-2xl border border-white/10 bg-slate-900/70 p-4 transition duration-300 focus-within:-translate-y-0.5 focus-within:border-cyan-400 focus-within:ring-2 focus-within:ring-cyan-400/20" for="amount-two">
                        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Amount in currency two</span>
                        <input id="amount-two" name="amount-two" type="text" placeholder="0.00" readonly class="mt-2 w-full bg-transparent text-2xl font-bold text-cyan-300 outline-none placeholder:text-slate-600">
                    </label>
                </div>

                <button type="submit" class="w-full rounded-2xl bg-blue-600 px-6 py-4 font-bold text-white shadow-lg shadow-indigo-950/40 transition duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-900/40 active:translate-y-0">Convert currencies <span aria-hidden="true">→</span></button>
                <p id="conversion-status" class="text-center text-sm text-slate-500" aria-live="polite">Rates update when you convert.</p>
            </form>
        </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>
